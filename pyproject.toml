[project]
name = "crawlkit"
version = "0.1.0"
description = "Domain-agnostic primitives for CDP-driven web scraping: CDP session, adapter framework, storage, weighted taxonomy classifier, structured logging, Prometheus metrics, rate limiting, robots.txt compliance. Extracted from ccarchive."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "prometheus-client>=0.19.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlkit*"]
